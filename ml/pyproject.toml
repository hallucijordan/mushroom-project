
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mushroom-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
